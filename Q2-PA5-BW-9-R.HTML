<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>
</head>
<body>
  
     <!-- Latest compiled and minified CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
     <!-- Latest compiled JavaScript -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
      <div class="container">
    <form action="" method="post">

  
        <h2 class="text-center text-primary">Custom Sneaker Order Form</h2>
      

        <label for="form-name">Name:</label> 
        <input type="text" name="username" id="form-name" class="form-control">
    
        <label for="form-email">Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="form-control">

        <label for="form-tel">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="form-control">

        <label for="form-story">Tell us about yourself:</label> 
        <textarea name="story" id="form-story" class="form-control"></textarea>
        
        <label for="sizes">Size:</label>
        <select name="size" id="sizes" class="form-select">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>
            
        <label for="colors">Sneaker Color:</label>
        <fieldset id="colors">
            <legend>Color</legend>
            <label class="form-check-label">
                <input type="radio" class="form-check-input" name="color" value="red"> Red
            </label>
            <label class="form-check-label">
                <input type="radio" class="form-check-input" name="color" value="blue"> Blue
            </label>
            <label class="form-check-label">
                <input type="radio" class="form-check-input" name="color" value="black"> Black
            </label>
            <label class="form-check-label">
                <input type="radio" class="form-check-input" name="color" value="silver"> Silver
            </label>
        </fieldset>
            
        <label for="features">Add-on Features:</label>
        <fieldset id="features">

            <legend>Feature</legend>
            <label class="form-check-label">
                <input type="checkbox" class="form-check-input" name="feature" value="laces"> Sparkley laces
            </label>
            <label class="form-check-label">
                <input type="checkbox" class="form-check-input" name="feature" value="logo" checked> Metallic logo
            </label>
            <label class="form-check-label">
                <input type="checkbox" class="form-check-input" name="feature" value="heels"> Light-up heels
            </label>
            <label class="form-check-label">
                <input type="checkbox" class="form-check-input" name="feature" value="mp3"> MP3-enabled
            </label>
        </fieldset>
            <button type="button" class="btn btn-primary mt-3" value="ENTER">ENTER</button>
    </form>
</body>
</html>
</div>
